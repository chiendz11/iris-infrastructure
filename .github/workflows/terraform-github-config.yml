name: terraform-github-config

on:
  push:
    branches: [main]
    paths:
      - "terraform/github-config/**"
      - ".github/workflows/terraform-github-config.yml"
  workflow_dispatch:
    inputs:
      source:
        description: Why GitHub configuration reconciliation was requested
        required: false
        type: string
        default: manual
      source_sha:
        description: Initiating commit SHA for audit only
        required: false
        type: string
        default: ""
      state_role_arn:
        description: Newly created config apply role ARN from foundation, when applicable
        required: false
        type: string
        default: ""
      reconcile_domain:
        description: Dispatch domain after GitHub configuration is current
        required: false
        type: boolean
        default: false
      reconcile_platform:
        description: Dispatch platform after GitHub configuration/domain is current
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-configuration-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_enable_public_domain: ${{ vars.ENABLE_PUBLIC_DOMAIN || 'false' }}
  TF_VAR_public_domain_name: ${{ vars.PUBLIC_DOMAIN_NAME }}
  TF_VAR_admin_role_arns: ${{ vars.ADMIN_ROLE_ARNS_JSON || '[]' }}
  TF_VAR_gitops_app_client_id: ${{ vars.GITOPS_APP_CLIENT_ID }}
  TF_VAR_production_reviewer_usernames: ${{ vars.PRODUCTION_REVIEWER_USERNAMES_JSON || '[]' }}

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      apply: ${{ steps.route.outputs.apply }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: Preserve control-plane dependency order
        id: route
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "apply=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            CHANGED="$(git ls-tree -r --name-only "${HEAD_SHA}")"
          else
            CHANGED="$(git diff --name-only "${BEFORE_SHA}" "${HEAD_SHA}")"
          fi

          if grep -Eq '^terraform/bootstrap/' <<<"${CHANGED}"; then
            echo "Foundation owns this run and will dispatch GitHub configuration with the new role ARN."
            echo "apply=false" >> "${GITHUB_OUTPUT}"
          elif grep -Eq '^terraform/platform/|^environments/production\.tfvars$|^scripts/sync_gitops_outputs\.py$' <<<"${CHANGED}"; then
            echo "Platform owns this run and will dispatch configuration after publishing new outputs."
            echo "apply=false" >> "${GITHUB_OUTPUT}"
          else
            echo "apply=true" >> "${GITHUB_OUTPUT}"
          fi

  apply-github-config:
    if: >-
      ${{ needs.route.outputs.apply == 'true' &&
          github.ref == 'refs/heads/main' }}
    needs: route
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate root-of-trust inputs
        env:
          STATE_ROLE_ARN: ${{ inputs.state_role_arn || vars.TF_GITHUB_CONFIG_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          APP_CLIENT_ID: ${{ vars.CONFIG_SYNC_APP_CLIENT_ID }}
        run: |
          test -n "${STATE_ROLE_ARN}" || { echo "TF_GITHUB_CONFIG_APPLY_ROLE_ARN is required." >&2; exit 1; }
          test -n "${STATE_BUCKET}" || { echo "TF_STATE_BUCKET is required." >&2; exit 1; }
          test -n "${STATE_KMS_KEY_ARN}" || { echo "TF_STATE_KMS_KEY_ARN is required." >&2; exit 1; }
          test -n "${APP_CLIENT_ID}" || { echo "CONFIG_SYNC_APP_CLIENT_ID is required." >&2; exit 1; }
          [[ "${STATE_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+-github-config-apply$ ]] || {
            echo "The state role must be a dedicated *-github-config-apply role." >&2
            exit 1
          }

      - name: Mint short-lived GitHub configuration token
        id: config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONFIG_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONFIG_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            iris-infrastructure
            iris-data-pipeline
            iris-model-registry
            iris-inference-service

      - name: Verify least-privilege GitHub App installation
        env:
          GH_TOKEN: ${{ steps.config-token.outputs.token }}
        run: |
          gh api installation > "${RUNNER_TEMP}/configuration-installation.json"
          jq -e '
            .permissions.administration == "write" and
            .permissions.environments == "write" and
            .permissions.variables == "write"
          ' "${RUNNER_TEMP}/configuration-installation.json" >/dev/null || {
            echo "Configuration App requires Administration, Environments and Variables write permissions." >&2
            exit 1
          }

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.6"

      - name: Assume least-privilege GitHub configuration state role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.state_role_arn || vars.TF_GITHUB_CONFIG_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect platform state and validate production reviewers
        env:
          REVIEWERS_JSON: ${{ vars.PRODUCTION_REVIEWER_USERNAMES_JSON || '[]' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          MANAGE_APPLICATION_CONFIG=false
          if aws s3api head-object \
            --bucket "${{ vars.TF_STATE_BUCKET }}" \
            --key infrastructure/platform.tfstate >/dev/null 2>&1; then
            MANAGE_APPLICATION_CONFIG=true
            jq -e --arg owner "${OWNER}" '
              type == "array" and length > 0 and
              all(.[]; type == "string" and length > 0 and (ascii_downcase != ($owner | ascii_downcase)))
            ' <<<"${REVIEWERS_JSON}" >/dev/null || {
              echo "PRODUCTION_REVIEWER_USERNAMES_JSON must contain an independent collaborator." >&2
              exit 1
            }
            test -n "${TF_VAR_gitops_app_client_id}" || {
              echo "GITOPS_APP_CLIENT_ID is required after the platform exists." >&2
              exit 1
            }
          fi
          echo "TF_VAR_manage_application_config=${MANAGE_APPLICATION_CONFIG}" >> "${GITHUB_ENV}"

      - name: Initialize GitHub configuration state
        working-directory: terraform/github-config
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: Create authoritative configuration plan
        working-directory: terraform/github-config
        env:
          GITHUB_TOKEN: ${{ steps.config-token.outputs.token }}
        run: terraform plan -out=tfplan

      - name: Reject production Environment deletion/replacement
        working-directory: terraform/github-config
        run: |
          terraform show -json tfplan > "${RUNNER_TEMP}/github-config-plan.json"
          if jq -e '
            any(
              .resource_changes[]?;
              .type == "github_repository_environment" and
              (.change.actions | index("delete")) != null
            )
          ' "${RUNNER_TEMP}/github-config-plan.json" >/dev/null; then
            echo "Deleting or replacing a protected prod Environment is blocked." >&2
            exit 1
          fi

      - name: Apply saved configuration plan
        working-directory: terraform/github-config
        env:
          GITHUB_TOKEN: ${{ steps.config-token.outputs.token }}
        run: terraform apply -auto-approve tfplan

      - name: Publish managed configuration
        working-directory: terraform/github-config
        env:
          SOURCE: ${{ inputs.source || github.event_name }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          {
            echo "## GitHub configuration reconciled"
            echo
            echo "- Requested by: ${SOURCE}"
            echo "- Initiating commit: \`${SOURCE_SHA}\`"
            echo "- Applied commit: \`${GITHUB_SHA}\`"
            echo "- Application configuration enabled: ${TF_VAR_manage_application_config}"
            echo
            echo '```json'
            terraform output -json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Continue AWS stack dependency chain
        if: inputs.reconcile_domain || inputs.reconcile_platform
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_DOMAIN: ${{ inputs.reconcile_domain || false }}
          RECONCILE_PLATFORM: ${{ inputs.reconcile_platform || false }}
        run: |
          if [[ "${RECONCILE_DOMAIN}" == "true" ]]; then
            gh workflow run terraform-domain.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref main \
              --field source=github-config \
              --field source_sha="${GITHUB_SHA}" \
              --field reconcile_platform="${RECONCILE_PLATFORM}"
          elif [[ "${RECONCILE_PLATFORM}" == "true" ]]; then
            gh workflow run terraform-platform.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref main \
              --field source=github-config \
              --field source_sha="${GITHUB_SHA}"
          fi
