name: reusable-certificate

on:
  workflow_call:
    inputs:
      foundation:
        description: Selected non-secret outputs from foundation in this run; empty uses existing configuration
        type: string
        default: '{}'

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_enable_public_domain: ${{ vars.ENABLE_PUBLIC_DOMAIN || 'false' }}
  TF_VAR_domain_name: ${{ vars.PUBLIC_DOMAIN_NAME }}

jobs:
  apply-domain-certificate:
    if: github.ref == 'refs/heads/main'
    # A new workflow run creates a distinct approval boundary without a second
    # deployment Environment. The zone workflow never waits on this runner.
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject stale or non-production execution before credentials
        run: bash scripts/assert-current-main.sh
      - name: Validate approved production configuration
        env:
          APPLY_ROLE_ARN: ${{ fromJSON(inputs.foundation).terraform_apply_role_arn || vars.TERRAFORM_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ fromJSON(inputs.foundation).state_bucket || vars.TF_STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ fromJSON(inputs.foundation).state_kms_key_arn || vars.TF_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          test "${TF_VAR_enable_public_domain}" = true
          test -n "${TF_VAR_domain_name}"
          test -n "${APPLY_ROLE_ARN}"
          test -n "${STATE_BUCKET}"
          test -n "${STATE_KMS_KEY_ARN}"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.6"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ fromJSON(inputs.foundation).terraform_apply_role_arn || vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read authoritative zone state after approval
        working-directory: terraform/domain
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${{ fromJSON(inputs.foundation).state_bucket || vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="kms_key_id=${{ fromJSON(inputs.foundation).state_kms_key_arn || vars.TF_STATE_KMS_KEY_ARN }}"
          STATE_DOMAIN="$(terraform output -raw domain_name)"
          STATE_DOMAIN="${STATE_DOMAIN%.}"
          CONFIGURED_DOMAIN="${TF_VAR_domain_name%.}"
          [[ "${STATE_DOMAIN,,}" == "${CONFIGURED_DOMAIN,,}" ]] || {
            echo "Domain state differs from approved configuration; reconcile the zone first." >&2
            exit 1
          }
          EXPECTED_NS="$(terraform output -json route53_name_servers | jq -ce 'select(type == "array" and length > 0)')"
          {
            echo "DOMAIN_NAME=${STATE_DOMAIN}"
            echo "EXPECTED_NAME_SERVERS=${EXPECTED_NS}"
          } >> "${GITHUB_ENV}"
      - name: Verify public DNS after owner approval
        run: |
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y dnsutils
          fi
          bash scripts/wait-for-dns-delegation.sh \
            "${DOMAIN_NAME}" "${EXPECTED_NAME_SERVERS}"
      - name: Request and validate ACM certificate
        working-directory: terraform/domain
        env:
          TF_VAR_domain_delegated: "true"
        run: |
          terraform plan -out=tfplan
          bash ../../scripts/assert-current-main.sh
          terraform apply tfplan
          test "$(terraform output -raw domain_ready)" = "true"
      - name: Publish certificate handoff
        env:
          SOURCE: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Certificate reconciliation completed"
            echo "- Requested by: ${SOURCE}"
            echo "- Initiating commit: ${SOURCE_SHA}"
            echo "- Applied commit: ${GITHUB_SHA}"
            echo "DNS was verified after your approval; ACM validation completed."
          } >> "${GITHUB_STEP_SUMMARY}"
