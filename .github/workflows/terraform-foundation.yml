name: terraform-foundation

on:
  push:
    branches: [main]
    paths:
      - "terraform/bootstrap/**"
  workflow_dispatch:
    inputs:
      source:
        description: Why foundation reconciliation was requested
        required: false
        type: string
        default: manual

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}

jobs:
  apply-foundation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      governance_reconcile_required: ${{ steps.route.outputs.governance_reconcile_required }}
      governance_apply_role_arn: ${{ steps.route.outputs.governance_apply_role_arn }}
      github_config_apply_role_arn: ${{ steps.route.outputs.github_config_apply_role_arn }}
      domain_reconcile_required: ${{ steps.route.outputs.domain_reconcile_required }}
      platform_reconcile_required: ${{ steps.route.outputs.platform_reconcile_required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate production automation configuration
        env:
          APPLY_ROLE_ARN: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
        run: |
          test -n "${APPLY_ROLE_ARN}" || { echo "TERRAFORM_APPLY_ROLE_ARN is required." >&2; exit 1; }
          test -n "${STATE_BUCKET}" || { echo "TF_STATE_BUCKET is required." >&2; exit 1; }
          test -n "${STATE_KMS_KEY_ARN}" || { echo "TF_STATE_KMS_KEY_ARN is required." >&2; exit 1; }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.6"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize foundation remote state
        working-directory: terraform/bootstrap
        run: |
          cp backend.tf.example backend.tf
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
      - name: Capture current downstream dependency
        id: before
        working-directory: terraform/bootstrap
        run: |
          APPLY_ROLE_ARN="$(terraform output -raw terraform_apply_role_arn 2>/dev/null || true)"
          echo "apply_role_arn=${APPLY_ROLE_ARN}" >> "${GITHUB_OUTPUT}"
      - name: Apply authoritative foundation plan
        working-directory: terraform/bootstrap
        run: |
          terraform plan -out=tfplan
          terraform apply tfplan
      - name: Decide downstream reconciliation
        id: route
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PREVIOUS_APPLY_ROLE_ARN: ${{ steps.before.outputs.apply_role_arn }}
        run: |
          DOMAIN_RECONCILE_REQUIRED=false
          GOVERNANCE_RECONCILE_REQUIRED=false
          PLATFORM_RECONCILE_REQUIRED=false
          CURRENT_APPLY_ROLE_ARN="$(
            terraform -chdir=terraform/bootstrap output -raw terraform_apply_role_arn
          )"
          CURRENT_GOVERNANCE_APPLY_ROLE_ARN="$(
            terraform -chdir=terraform/bootstrap output -raw github_governance_apply_role_arn
          )"
          CURRENT_GITHUB_CONFIG_APPLY_ROLE_ARN="$(
            terraform -chdir=terraform/bootstrap output -raw github_config_apply_role_arn
          )"

          if [[ "${PREVIOUS_APPLY_ROLE_ARN}" != "${CURRENT_APPLY_ROLE_ARN}" ]]; then
            PLATFORM_RECONCILE_REQUIRED=true
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
              CHANGED="$(git ls-tree -r --name-only "${HEAD_SHA}")"
            else
              CHANGED="$(git diff --name-only "${BEFORE_SHA}" "${HEAD_SHA}")"
            fi

            if grep -Eq '^terraform/domain/|^scripts/detect-domain-delegation\.sh$' <<<"${CHANGED}"; then
              DOMAIN_RECONCILE_REQUIRED=true
            fi
            if grep -Eq '^terraform/github-governance/' <<<"${CHANGED}"; then
              GOVERNANCE_RECONCILE_REQUIRED=true
            fi
            if grep -Eq '^terraform/platform/|^environments/production\.tfvars$|^scripts/sync_gitops_outputs\.py$' <<<"${CHANGED}"; then
              PLATFORM_RECONCILE_REQUIRED=true
            fi
          fi

          {
            echo "governance_reconcile_required=${GOVERNANCE_RECONCILE_REQUIRED}"
            echo "governance_apply_role_arn=${CURRENT_GOVERNANCE_APPLY_ROLE_ARN}"
            echo "github_config_apply_role_arn=${CURRENT_GITHUB_CONFIG_APPLY_ROLE_ARN}"
            echo "domain_reconcile_required=${DOMAIN_RECONCILE_REQUIRED}"
            echo "platform_reconcile_required=${PLATFORM_RECONCILE_REQUIRED}"
          } >> "${GITHUB_OUTPUT}"
      - name: Publish foundation result
        working-directory: terraform/bootstrap
        env:
          SOURCE: ${{ inputs.source || github.event_name }}
        run: |
          {
            echo "## Foundation reconciled"
            echo
            echo "- Requested by: ${SOURCE}"
            echo "- Applied commit: \`${GITHUB_SHA}\`"
            echo
            echo "Terraform used remote state and applied the refreshed post-merge plan diff."
            echo "The first bootstrap remains a local operation because its OIDC role"
            echo "does not exist before that operation."
            echo
            echo '```json'
            terraform output -json | jq 'with_entries(.value |= {value: .value})'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  dispatch-governance:
    if: needs.apply-foundation.outputs.governance_reconcile_required == 'true'
    needs: apply-foundation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Reconcile GitHub governance after foundation
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ROLE_ARN: ${{ needs.apply-foundation.outputs.governance_apply_role_arn }}
        run: |
          gh workflow run terraform-governance.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            --field source=foundation \
            --field source_sha="${GITHUB_SHA}" \
            --field state_role_arn="${STATE_ROLE_ARN}"
          echo "Dispatched terraform-governance.yml after foundation reconciliation."

  dispatch-github-config:
    # Every foundation change may alter one of the IAM/state outputs published
    # to GitHub. Configuration reconciliation is therefore the single gateway
    # before continuing to domain/platform.
    needs: apply-foundation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Reconcile GitHub configuration after foundation
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ROLE_ARN: ${{ needs.apply-foundation.outputs.github_config_apply_role_arn }}
          RECONCILE_DOMAIN: ${{ needs.apply-foundation.outputs.domain_reconcile_required }}
          RECONCILE_PLATFORM: ${{ needs.apply-foundation.outputs.platform_reconcile_required }}
        run: |
          gh workflow run terraform-github-config.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            --field source=foundation \
            --field source_sha="${GITHUB_SHA}" \
            --field state_role_arn="${STATE_ROLE_ARN}" \
            --field reconcile_domain="${RECONCILE_DOMAIN}" \
            --field reconcile_platform="${RECONCILE_PLATFORM}"
          echo "Dispatched GitHub configuration before downstream AWS stacks."
