name: reusable-governance

on:
  workflow_call:
    inputs:
      foundation:
        description: Selected non-secret outputs from foundation in this run; empty uses existing configuration
        type: string
        default: '{}'

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_discover_existing_rulesets: "true"

jobs:
  apply-governance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject stale or non-production execution before credentials
        run: bash scripts/assert-current-main.sh
      - name: Validate protected automation inputs
        env:
          STATE_ROLE_ARN: ${{ fromJSON(inputs.foundation).github_governance_apply_role_arn || vars.TF_GOVERNANCE_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ fromJSON(inputs.foundation).state_bucket || vars.TF_STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ fromJSON(inputs.foundation).state_kms_key_arn || vars.TF_STATE_KMS_KEY_ARN }}
          APP_CLIENT_ID: ${{ vars.GOVERNANCE_APP_CLIENT_ID }}
        run: |
          test -n "${STATE_ROLE_ARN}" || { echo "TF_GOVERNANCE_APPLY_ROLE_ARN is required." >&2; exit 1; }
          test -n "${STATE_BUCKET}" || { echo "TF_STATE_BUCKET is required." >&2; exit 1; }
          test -n "${STATE_KMS_KEY_ARN}" || { echo "TF_STATE_KMS_KEY_ARN is required." >&2; exit 1; }
          test -n "${APP_CLIENT_ID}" || { echo "GOVERNANCE_APP_CLIENT_ID is required." >&2; exit 1; }
          [[ "${STATE_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+-github-governance-apply$ ]] || {
            echo "The state role must be a dedicated *-github-governance-apply role." >&2
            exit 1
          }

      - name: Mint short-lived GitHub governance token
        id: governance-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            iris-infrastructure
            iris-gitops
            iris-data-pipeline
            iris-model-registry
            iris-inference-service
          permission-administration: write

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.6"

      - name: Assume least-privilege governance state role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ fromJSON(inputs.foundation).github_governance_apply_role_arn || vars.TF_GOVERNANCE_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize GitHub governance state
        working-directory: terraform/github-governance
        run: |
          terraform init \
            -backend-config="bucket=${{ fromJSON(inputs.foundation).state_bucket || vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="kms_key_id=${{ fromJSON(inputs.foundation).state_kms_key_arn || vars.TF_STATE_KMS_KEY_ARN }}"

      - name: Create authoritative ruleset plan
        working-directory: terraform/github-governance
        env:
          GITHUB_TOKEN: ${{ steps.governance-token.outputs.token }}
        run: terraform plan -out=tfplan

      - name: Reject destructive ruleset plans
        working-directory: terraform/github-governance
        run: |
          terraform show -json tfplan > "${RUNNER_TEMP}/github-governance-plan.json"
          if jq -e '
            any(
              .resource_changes[]?;
              .type == "github_repository_ruleset" and
              (.change.actions | index("delete")) != null
            )
          ' "${RUNNER_TEMP}/github-governance-plan.json" >/dev/null; then
            echo "Ruleset delete/replace is blocked. Use the documented break-glass procedure." >&2
            exit 1
          fi

      - name: Publish plan summary
        working-directory: terraform/github-governance
        run: |
          {
            echo "## GitHub governance plan"
            echo
            echo "The protected job will apply this exact saved plan."
            echo
            echo '```text'
            terraform show -no-color tfplan
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply saved ruleset plan
        working-directory: terraform/github-governance
        env:
          GITHUB_TOKEN: ${{ steps.governance-token.outputs.token }}
        run: |
          bash ../../scripts/assert-current-main.sh
          terraform apply -auto-approve tfplan

      - name: Verify effective repository rulesets
        env:
          GH_TOKEN: ${{ steps.governance-token.outputs.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: bash scripts/migrate-rulesets.sh

      - name: Publish managed rulesets
        working-directory: terraform/github-governance
        env:
          SOURCE: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo
            echo "## GitHub governance reconciled"
            echo
            echo "- Requested by: ${SOURCE}"
            echo "- Initiating commit: \`${SOURCE_SHA}\`"
            echo "- Applied commit: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            terraform output -json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
