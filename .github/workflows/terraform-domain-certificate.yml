name: terraform-domain-certificate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main revision from the zone run; empty for reviewed manual recovery
        type: string
        default: ""

permissions:
  contents: read

# Same outer lock as production-infra, never nested inside reusable jobs.
concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  verify-revision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the zone handoff revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: bash scripts/assert-current-main.sh

  certificate:
    needs: verify-revision
    permissions:
      contents: read
      id-token: write
    # The called job uses existing prod and owner approval, in this distinct run.
    uses: ./.github/workflows/reusable-certificate.yml

  continue-platform:
    needs: certificate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/assert-current-main.sh
      - name: Continue orchestration at platform, not foundation or DNS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run production-infra.yml \
            --repo "${GITHUB_REPOSITORY}" --ref main \
            --field scope=platform --field expected_sha="${GITHUB_SHA}"
