name: terraform-platform

on:
  push:
    branches: [main]
    paths:
      - "terraform/platform/**"
      - "environments/production.tfvars"
      - "scripts/sync_gitops_outputs.py"
  workflow_dispatch:
    inputs:
      source:
        description: Why the platform reconciliation was requested
        required: false
        type: string
        default: manual
      source_sha:
        description: Initiating commit SHA for audit only
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # This group is intentionally shared with foundation/domain to prevent
  # concurrent AWS mutation. Dependency order comes from explicit dispatches.
  group: terraform-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
  TF_VAR_enable_public_domain: ${{ vars.ENABLE_PUBLIC_DOMAIN || 'false' }}
  TF_VAR_admin_role_arns: ${{ vars.ADMIN_ROLE_ARNS_JSON || '[]' }}

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      apply: ${{ steps.route.outputs.apply }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: Decide whether this workflow owns the apply
        id: route
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "apply=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            CHANGED="$(git ls-tree -r --name-only "${HEAD_SHA}")"
          else
            CHANGED="$(git diff --name-only "${BEFORE_SHA}" "${HEAD_SHA}")"
          fi
          if grep -Eq '^terraform/domain/|^scripts/detect-domain-delegation\.sh$' <<<"${CHANGED}"; then
            echo "Domain changed in the same push; terraform-domain will dispatch platform after ACM."
            echo "apply=false" >> "${GITHUB_OUTPUT}"
          elif grep -Eq '^terraform/bootstrap/' <<<"${CHANGED}"; then
            echo "Foundation changed in the same push; terraform-foundation will dispatch platform."
            echo "apply=false" >> "${GITHUB_OUTPUT}"
          else
            echo "apply=true" >> "${GITHUB_OUTPUT}"
          fi

  apply-platform:
    if: >-
      ${{ needs.route.outputs.apply == 'true' &&
          github.ref == 'refs/heads/main' }}
    needs: route
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate production automation configuration
        env:
          APPLY_ROLE_ARN: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          GITOPS_APP_CLIENT_ID: ${{ vars.GITOPS_APP_CLIENT_ID }}
        run: |
          test -n "${APPLY_ROLE_ARN}" || { echo "TERRAFORM_APPLY_ROLE_ARN is required." >&2; exit 1; }
          test -n "${STATE_BUCKET}" || { echo "TF_STATE_BUCKET is required." >&2; exit 1; }
          test -n "${STATE_KMS_KEY_ARN}" || { echo "TF_STATE_KMS_KEY_ARN is required." >&2; exit 1; }
          test -n "${GITOPS_APP_CLIENT_ID}" || { echo "GITOPS_APP_CLIENT_ID is required." >&2; exit 1; }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.6"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish reconciliation provenance
        env:
          SOURCE: ${{ inputs.source || github.event_name }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          {
            echo "## Platform reconciliation"
            echo
            echo "- Requested by: ${SOURCE}"
            echo "- Initiating commit: \`${SOURCE_SHA}\`"
            echo "- Applied event commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Initialize platform remote state
        working-directory: terraform/platform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
      - name: Apply authoritative platform plan
        working-directory: terraform/platform
        run: |
          terraform plan -var-file=../../environments/production.tfvars -out=tfplan
          terraform apply tfplan
      - name: Export non-secret infrastructure outputs
        run: terraform -chdir=terraform/platform output -json > terraform-outputs.json
      - name: Reconcile GitHub variables from current platform outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run terraform-github-config.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            --field source=platform \
            --field source_sha="${GITHUB_SHA}"
          echo "Dispatched GitHub configuration reconciliation for application repositories."
      - name: Mint short-lived GitOps pull-request token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: iris-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Verify GitOps App repository access
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          test "$(gh api repos/chiendz11/iris-gitops --jq '.permissions.push // false')" = "true" || {
            echo "GitOps App installation cannot push to chiendz11/iris-gitops." >&2
            exit 1
          }
      - name: Checkout GitOps desired state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: chiendz11/iris-gitops
          token: ${{ steps.gitops-token.outputs.token }}
          persist-credentials: false
          path: gitops
      - name: Render infrastructure outputs into GitOps
        run: |
          python scripts/sync_gitops_outputs.py \
            --outputs terraform-outputs.json \
            --gitops gitops
      - name: Open GitOps synchronization pull request
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          cd gitops
          if git diff --quiet; then
            echo "GitOps already matches Terraform outputs."
            exit 0
          fi

          BRANCH="infra/sync-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "${BRANCH}"
          git config user.name "iris-infra-bot"
          git config user.email "iris-infra-bot@users.noreply.github.com"
          git add -- applications environments platform
          git commit -m "chore(platform): sync Terraform outputs"
          gh auth setup-git
          git push origin "${BRANCH}"
          gh pr create --repo chiendz11/iris-gitops --base main --head "${BRANCH}" \
            --title "chore(platform): sync Terraform outputs" \
            --body "Generated from chiendz11/iris-infrastructure@${{ github.sha }}. No secret values are included."
