version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/domain
      - /terraform/github-config
      - /terraform/github-governance
      - /terraform/platform
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform
