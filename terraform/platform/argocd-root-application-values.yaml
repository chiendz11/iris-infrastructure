# The Argo CD chart renders extraObjects only after installing its CRDs. This
# lets Terraform own the root Application in the same helm_release without a
# kubernetes_manifest plan-time dependency on a CRD that does not exist yet.
extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: iris-production
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/chiendz11/iris-gitops.git
        targetRevision: main
        path: applications
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff: {duration: 10s, factor: 2, maxDuration: 3m}
